<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hannah's Market Day Adventure</title>
<style>
:root{--navy:#263a56;--teal:#217e84;--mint:#dbf4e9;--peach:#ffe7cc;--pink:#fce5e9;--cream:#fffaf0;--gold:#efad38}*{box-sizing:border-box}body{margin:0;font-family:'Trebuchet MS',Arial,sans-serif;background:linear-gradient(135deg,#e4f6f0,#fff6e6);color:var(--navy);min-height:100vh}.wrap{max-width:880px;margin:auto;padding:18px}.header{text-align:center;padding:20px 8px}.eyebrow{font-size:13px;letter-spacing:2px;color:var(--teal);font-weight:700}.header h1{font-size:clamp(28px,5vw,44px);margin:8px 0}.lead{font-size:17px;line-height:1.6}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.pill{background:white;padding:10px 16px;border-radius:28px;font-weight:700;box-shadow:0 3px 12px #20475312}.progress{height:12px;background:#d3e5e1;border-radius:20px;overflow:hidden;margin:16px 0 24px}.bar{background:linear-gradient(90deg,#44b0a6,#87d7b2);height:100%;width:0;transition:.3s}.panel{background:white;border:2px solid #e4eee8;border-radius:28px;box-shadow:0 12px 36px #203c4715;padding:clamp(18px,4vw,36px);min-height:390px}.level{font-size:14px;color:var(--teal);font-weight:800;text-transform:uppercase;letter-spacing:1px}.question{font-size:clamp(23px,4vw,31px);margin:14px 0}.hint{color:#61738a;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:24px}.card{background:var(--cream);border:2px solid #e4ddd0;border-radius:20px;padding:20px 12px;font-size:18px;cursor:pointer;min-height:128px;transition:.15s;color:var(--navy);font-weight:bold}.card:hover{transform:translateY(-2px);border-color:var(--teal)}.card:focus-visible,.btn:focus-visible{outline:4px solid #ffc76a;outline-offset:3px}.emoji{display:block;font-size:45px;margin-bottom:9px}.btn{border:0;border-radius:17px;background:var(--teal);color:white;font-size:18px;font-weight:800;padding:15px 23px;cursor:pointer;box-shadow:0 5px 0 #14565a}.btn:disabled{background:#9facac;box-shadow:none;cursor:not-allowed}.btn.secondary{background:#f2f7f5;color:var(--navy);box-shadow:none;border:2px solid #dce9e3}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}.feedback{padding:15px;border-radius:18px;background:var(--mint);line-height:1.55;margin-top:18px;font-size:17px}.feedback.try{background:var(--pink)}.center{text-align:center}.heroemoji{font-size:75px;margin:12px 0}.choice{display:flex;gap:12px;justify-content:center;margin-top:15px;flex-wrap:wrap}.choice .btn{min-width:130px}.choice .btn.want{background:#da7892;box-shadow:0 5px 0 #aa536d}.mini{font-size:14px;color:#6f7e90}.tag{display:inline-block;padding:7px 12px;border-radius:30px;background:#e9f4ef;margin:5px;font-weight:bold}.shopgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.shop{border:2px solid #e1e7de;background:#fffaf0;padding:15px;border-radius:18px;cursor:pointer;font-weight:700;color:var(--navy);font-size:16px;min-height:115px}.shop.sel{background:#d6f3e7;border-color:#218b81}.shop:disabled{opacity:.55;cursor:not-allowed}.shop .emoji{font-size:37px}.sentence{border:2px dashed #a7cabd;border-radius:20px;padding:18px;margin:14px 0;background:#f7fcf8;font-size:20px;line-height:1.7}select{font:inherit;border:2px solid #9dc9bd;border-radius:10px;padding:8px;color:var(--navy);background:white;max-width:100%}.stars{font-size:35px;letter-spacing:5px;color:var(--gold)}.footer{text-align:center;color:#607e83;padding:18px;font-size:13px}.hidden{display:none}@media(max-width:520px){.wrap{padding:10px}.grid{gap:8px}.card{min-height:115px;padding:14px 8px;font-size:16px}.shopgrid{grid-template-columns:repeat(2,1fr)}.panel{border-radius:20px}.choice .btn{min-width:110px}}
</style></head><body><main class="wrap"><header class="header"><div class="eyebrow">REACH HIGHER · UNIT 3 LESSON 2</div><h1>🛒 Hannah's Market Day Adventure</h1><p class="lead">Needs & Wants · Read, think, choose and speak!</p></header><div class="topline"><div id="label" class="pill">Ready to play?</div><div id="score" class="pill">⭐ 0 stars</div></div><div class="progress"><div class="bar" id="bar"></div></div><section id="panel" class="panel" aria-live="polite"></section><p class="footer">Made for learning together 🌿 · Works offline · No sign-in or purchases</p></main>
<script>
const panel=document.querySelector('#panel'),label=document.querySelector('#label'),scoreEl=document.querySelector('#score'),bar=document.querySelector('#bar');let stage=0,index=0,stars=0,locked=false,selected=[],stageStars=0;
const sorter=[{e:'💧',n:'Water',a:'need',why:'Our bodies need water.'},{e:'🍭',n:'Candy',a:'want',why:'Candy is a treat. We can live without it.'},{e:'🏠',n:'A safe home',a:'need',why:'We need a safe place to live.'},{e:'🦕',n:'A toy dinosaur',a:'want',why:'Toys are fun, but we can choose not to buy one.'},{e:'🥦',n:'Healthy food',a:'need',why:'We need nutritious food to grow.'},{e:'🍦',n:'Ice cream',a:'want',why:'Ice cream is something we may want.'},{e:'🧥',n:'A warm coat on a cold day',a:'need',why:'Warm clothing helps keep us safe in cold weather.'},{e:'👗',n:'Another pretty dress',a:'want',why:'If we already have enough clothes, another dress is a want.'}];
const situations=[{q:'It is raining. Mia has no umbrella or raincoat. What does she need?',options:[['☔','A raincoat'],['🍬','Candy']],correct:0,why:'She needs to stay dry and warm.'},{q:'Ben already has shoes that fit. He sees sparkly new shoes. What are they today?',options:[['✨','A want'],['🧸','A need']],correct:0,why:'He has shoes that fit, so the new pair is a want.'},{q:'Bella’s mom must paint a wall today. What does she need for her job?',options:[['🎨','Paint'],['🍦','Ice cream']],correct:0,why:'Paint is needed to finish her task. A need can depend on the situation.'},{q:'You are very thirsty after playing outside. What do you need first?',options:[['💧','Water'],['🍭','Candy']],correct:0,why:'Water helps your body when you are thirsty.'}];
const shopping=[{e:'🍞',n:'Bread',type:'need'},{e:'🍎',n:'Apples',type:'need'},{e:'🥛',n:'Milk',type:'need'},{e:'🍬',n:'Candy',type:'want'},{e:'🦕',n:'Toy dinosaur',type:'want'},{e:'🍦',n:'Ice cream',type:'want'}];
function update(){scoreEl.textContent=`⭐ ${stars} stars`;label.textContent=['Welcome','Level 1 · Sort it!','Level 2 · Think about it!','Level 3 · Shop smart!','Level 4 · Say it!','Great job!'][stage];bar.style.width=`${Math.round((stage===0?0:stage===5?1:(stage-1)/4)*100)}%`}
function next(){stage++;index=0;locked=false;selected=[];render()}
function award(){stars++;update()}
function render(){update();if(stage===0){panel.innerHTML=`<div class="center"><div class="heroemoji">🛍️🍎🧸</div><div class="level">Hello, explorer!</div><h2 class="question">Can you tell a NEED from a WANT?</h2><p class="hint">A <b>need</b> is something important for health, safety, or a task.<br>A <b>want</b> is something nice to have, but we can manage without it.</p><div class="actions"><button class="btn" onclick="next()">Start Adventure →</button></div></div>`;return}
if(stage===1){let it=sorter[index];panel.innerHTML=`<div class="level">Level 1 · Card ${index+1} / ${sorter.length}</div><h2 class="question center">Need or Want?</h2><div class="center"><div class="heroemoji">${it.e}</div><h2>${it.n}</h2><p class="hint">Tap your answer!</p><div class="choice"><button class="btn" onclick="chooseSort('need')">💚 NEED</button><button class="btn want" onclick="chooseSort('want')">💗 WANT</button></div></div><div id="feedback"></div>`;return}
if(stage===2){let it=situations[index];panel.innerHTML=`<div class="level">Level 2 · Question ${index+1} / ${situations.length}</div><h2 class="question">🤔 ${it.q}</h2><div class="grid">${it.options.map((o,i)=>`<button class="card" onclick="chooseSituation(${i})"><span class="emoji">${o[0]}</span>${o[1]}</button>`).join('')}</div><div id="feedback"></div>`;return}
if(stage===3){panel.innerHTML=`<div class="level">Level 3 · Market Mission</div><h2 class="question">🛒 Bella’s family needs food for today.</h2><p class="hint">Choose <b>3 foods</b> for the shopping basket. There are treats and toys, too!</p><div class="shopgrid">${shopping.map((it,i)=>`<button aria-pressed="${selected.includes(i)}" class="shop ${selected.includes(i)?'sel':''}" onclick="toggleShop(${i})"><span class="emoji">${it.e}</span>${it.n}${selected.includes(i)?' ✓':''}</button>`).join('')}</div><div class="center"><p><b>🧺 Basket: ${selected.length} / 3</b></p><button class="btn" onclick="checkShop()" ${selected.length!==3?'disabled':''}>Check my basket</button></div><div id="feedback"></div>`;return}
if(stage===4){panel.innerHTML=`<div class="level">Level 4 · Speak like a star</div><h2 class="question">🎤 Tell your grown-up!</h2><p class="hint">Choose words, then say the sentences out loud. Grown-up: ask “Why?” and listen to Hannah's idea.</p><div class="sentence">I need <select id="need" aria-label="Choose what you need"><option value="water">water</option><option value="healthy food">healthy food</option><option value="a warm coat">a warm coat</option></select> because <select id="needwhy" aria-label="Choose reason"><option value="I am thirsty">I am thirsty</option><option value="I need to grow">I need to grow</option><option value="it is cold">it is cold</option></select>.</div><div class="sentence">I want <select id="want" aria-label="Choose what you want"><option value="a toy dinosaur">a toy dinosaur</option><option value="ice cream">ice cream</option><option value="a sticker">a sticker</option></select> because <select id="wantwhy" aria-label="Choose reason"><option value="it is fun">it is fun</option><option value="it tastes yummy">it tastes yummy</option><option value="it looks pretty">it looks pretty</option></select>.</div><p class="mini">Tip: Try to match each reason to the thing you chose. There can be more than one good answer!</p><div class="actions"><button class="btn secondary" onclick="speakSentences()">🔊 Hear my sentences</button><button class="btn" onclick="finish()">I said them! ⭐</button></div><div id="feedback"></div>`;return}
if(stage===5){panel.innerHTML=`<div class="center"><div class="heroemoji">🏆</div><div class="level">Mission complete!</div><h2 class="question">Amazing work, Hannah!</h2><div class="stars">⭐ ⭐ ⭐ ⭐</div><p class="lead">You earned <b>${stars} stars</b>!<br>You can sort, think, shop and speak!</p><p class="hint">Bonus question: Can the same thing be a NEED in one situation and a WANT in another?</p><div class="actions"><button class="btn" onclick="restart()">↻ Play again</button><button class="btn secondary" onclick="window.print()">🖨 Print</button></div></div>`}}
function feedback(msg,ok,cb){document.querySelector('#feedback').innerHTML=`<div class="feedback ${ok?'':'try'}">${ok?'🌟 Great thinking!':'💡 Try again!'} ${msg}</div>${ok?'<div class="actions"><button class="btn" id="continue">Continue →</button></div>':''}`;if(ok)document.querySelector('#continue').onclick=cb}
function chooseSort(a){if(locked)return;let it=sorter[index];if(a===it.a){locked=true;award();feedback(it.why,true,()=>{index++;locked=false;if(index===sorter.length)next();else render()})}else feedback('Think: Do we need this for our health, safety or an important task? '+it.why,false)}
function chooseSituation(a){if(locked)return;let it=situations[index];if(a===it.correct){locked=true;award();feedback(it.why,true,()=>{index++;locked=false;if(index===situations.length)next();else render()})}else feedback('Look at the story again. What is important in this situation?',false)}
function toggleShop(i){if(selected.includes(i))selected=selected.filter(x=>x!==i);else if(selected.length<3)selected.push(i);render()}
function checkShop(){if(selected.length!==3)return;let ok=selected.every(i=>shopping[i].type==='need');if(ok){award();feedback('Bread, apples and milk are on our food list today. Great shopping!',true,()=>next())}else feedback('Try choosing 3 foods for today’s meals instead of treats or toys.',false)}
function speakSentences(){let a=document.querySelector('#need').value,b=document.querySelector('#needwhy').value,c=document.querySelector('#want').value,d=document.querySelector('#wantwhy').value;let s=`I need ${a} because ${b}. I want ${c} because ${d}.`;document.querySelector('#feedback').innerHTML=`<div class="feedback">🗣 ${s}</div>`;if('speechSynthesis' in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}else document.querySelector('#feedback').innerHTML+='<p class="mini">Voice playback is not available in this browser. Read the sentence aloud together.</p>'}
function finish(){award();next()}function restart(){stage=0;index=0;stars=0;selected=[];locked=false;render()}render();
</script></body></html>
